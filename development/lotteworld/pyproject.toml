[project]
name = "lotteworld-sim"
version = "0.1.0"
description = "롯데월드 매직아일랜드 시나리오 설정 기반"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lotteworld-sim = "lotteworld_sim.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lotteworld_sim*"]
