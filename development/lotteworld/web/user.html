<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시설 선호 순위 · 매직아일랜드</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/map-viewport.css">
  <link rel="stylesheet" href="/user.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
  <script type="module" src="/user.js"></script>
</head>
<body>
  <header class="site-header"><div class="container">매직아일랜드</div></header>
  <main class="container">
    <header class="intro">
      <h1>시설 선호 순위</h1>
      <p id="order-help">손잡이를 끌어 타고 싶은 순서로 놓고 저장해 주세요. 키보드에서는 손잡이에 초점을 맞춘 뒤 위·아래 방향키를 누르세요.</p>
    </header>
    <form id="preferences" aria-describedby="order-help" hidden>
      <fieldset id="controls">
        <legend class="visually-hidden">시설 순위 조정</legend>
        <ol id="facility-order" class="card"></ol>
        <button class="save" type="submit">선호 저장</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite">가상 캐릭터를 연결하는 중입니다.</p>
    <button type="button" id="retry" hidden>다시 연결</button>
    <section class="card" id="character" aria-labelledby="character-title" hidden>
      <h2 id="character-title">내 가상 캐릭터</h2>
      <p id="character-id"></p>
      <p id="character-position"></p>
      <p id="character-phase"></p>
      <p id="character-progress" hidden></p>
      <p id="destination-note"></p>
      <button type="button" id="destination" hidden></button>
      <button type="button" id="accept-recommendation" hidden>추천 수락하고 출발</button>
      <p id="accept-status" role="status"></p>
      <div id="user-map-frame" hidden>
        <div id="user-scene" class="viewport"><div class="labels"></div></div>
        <button type="button" id="resume-follow" hidden>내 캐릭터 다시 따라가기</button>
      </div>
      <p id="character-sync" role="status"></p>
    </section>
    <noscript>이 화면을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  </main>
</body>
</html>
