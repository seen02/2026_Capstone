<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 940" role="img" aria-labelledby="plan-title plan-desc"><title id="plan-title">스마트 대피 안내 시연용 지하상가 B1 구역 평면도</title><desc id="plan-desc">32×24미터 지하상가 일부 구역. 가운데 행사·휴게광장에서 시작해 S1에서 좌우로 갈라지고, S2와 S3 앞 두 지상 연결 계단 진입부까지 이동합니다. 계단 상승은 계산하지 않습니다. 북쪽 연결 복도로 우회할 수 있습니다.</desc><defs><marker id="route-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#168873"/></marker></defs><style>
